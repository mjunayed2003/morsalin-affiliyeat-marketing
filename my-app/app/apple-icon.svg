<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient (Rich Emerald to Deep Forest) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" />
      <stop offset="0.5" stop-color="#047857" />
      <stop offset="1" stop-color="#064e3b" />
    </linearGradient>

    <!-- Top Face Gradient -->
    <linearGradient id="topFace" x1="32" y1="12" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="leftFace" x1="14" y1="24" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="1" stop-color="#064e3b" />
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="rightFace" x1="32" y1="24" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#047857" />
      <stop offset="1" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Ribbon Gradient -->
    <linearGradient id="goldRibbon" x1="20" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Container for Browser Tab Recognition -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- 3D Parcel Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Left Face -->
    <path d="M14 26L32 36V54L14 44V26Z" fill="url(#leftFace)" />

    <!-- Right Face -->
    <path d="M32 36L50 26V44L32 54V36Z" fill="url(#rightFace)" />

    <!-- Top Face -->
    <path d="M32 14L50 24L32 34L14 24L32 14Z" fill="url(#topFace)" />

    <!-- Top Ribbon Cross -->
    <path d="M28.5 16L46.5 26L43.5 27.7L25.5 17.7L28.5 16Z" fill="url(#goldRibbon)" />
    <path d="M35.5 16L17.5 26L20.5 27.7L38.5 17.7L35.5 16Z" fill="url(#goldRibbon)" />

    <!-- Left Vertical Ribbon -->
    <path d="M20.5 30V48L24 50V32L20.5 30Z" fill="url(#goldRibbon)" />

    <!-- Right Vertical Ribbon -->
    <path d="M40 32V50L43.5 48V30L40 32Z" fill="url(#goldRibbon)" />
  </g>

  <!-- Golden Twinkle Sparkle Star at Top Right -->
  <path d="M48 8L49.5 12.5L54 14L49.5 15.5L48 20L46.5 15.5L42 14L46.5 12.5L48 8Z" fill="#fef08a" />
  <circle cx="48" cy="14" r="1.5" fill="#ffffff" />
</svg>
